<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Weekly Yoruba Proverb</title>
    <style>
      body {
        margin: 0;
        padding: 24px 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }
      .wrapper {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }
      .content {
        padding: 0 24px;
      }
      .greeting {
        font-size: 16px;
        margin-bottom: 24px;
      }
      .yoruba {
        font-size: 24px;
        line-height: 1.5;
        margin-bottom: 16px;
      }
      .translation {
        font-size: 15px;
        margin-bottom: 16px;
      }
      .wisdom {
        font-size: 15px;
        font-style: italic;
        margin-bottom: 32px;
      }
      .signoff {
        font-size: 15px;
      }
      .footer {
        margin-top: 40px;
        padding-top: 16px;
        font-size: 12px;
      }
      .brand {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 24px;
      }
      .brand a {
        text-decoration: none;
      }
      .footer a {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr>
        <td align="center">
          <table role="presentation" class="wrapper" cellspacing="0" cellpadding="0" border="0" width="520">
            <tr>
              <td class="content">
                <p class="greeting">Hello {{name}},</p>

                <div class="yoruba">{{proverb}}</div>
                <div class="translation">{{translation}}</div>
                <div class="wisdom">{{wisdom}}</div>

                <p class="signoff">— <a href="https://dapoadedire.com/">Adedapo Adedire</a></p>

                <div class="footer">
                  <a href="{{unsubscribeUrl}}">Unsubscribe</a>
                  <p><a href="https://yorubaproverbs.dapoadedire.com/">&copy; {{year}} Yoruba Proverbs</a></p>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
